<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Yaffle</title>
  <meta name="description" content="A calm calorie and macro tracker." />
  <link rel="canonical" href="https://yaffleapp.com/" />

  <!-- yaffleapp.com is the primary domain (ADR 0015). Firebase still serves
       goyaffle.web.app and goyaffle.firebaseapp.com, which send every visit,
       the installed app included, to the same page on yaffleapp.com before
       anything paints. -->
  <script>
    if (/^goyaffle\.(web\.app|firebaseapp\.com)$/.test(location.hostname)) {
      location.replace("https://yaffleapp.com" + location.pathname + location.search + location.hash)
    }
  </script>

  <!-- Warm Market flour as the browser/OS chrome colour. ThemeProvider keeps
       this single meta in sync with the resolved theme (light #f6f1e6 / dark
       #17110c) so it follows the in-app toggle, not just the OS preference. -->
  <meta name="theme-color" content="#f6f1e6" />

  <!-- Resolve light/dark before the first frame. ThemeProvider applies the
       same class once React runs, but that is after the whole bundle has
       evaluated — up to a second on a phone — and until then a dark-mode user
       would see the light background. Mirrors theme-provider.tsx: the stored
       choice ("theme"), else the OS preference. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme")
        if (t !== "dark" && t !== "light") {
          t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
        }
        document.documentElement.classList.add(t)
        var m = document.querySelector('meta[name="theme-color"]')
        if (m) m.setAttribute("content", t === "dark" ? "#17110c" : "#f6f1e6")
      } catch (e) {}
    })()
  </script>

  <!-- iOS Safari zooms the page in on any text field whose text is under
       16px, and leaves it zoomed after the keyboard closes. Our fields use
       14px, so on iOS (iPadOS reports itself as a Mac with touch) the viewport
       gets maximum-scale=1: Safari then no longer zooms on focus, while pinch
       zoom keeps working, since iOS ignores maximum-scale for the user's own
       gestures. Android does not zoom on focus and does honour maximum-scale,
       so it keeps the plain viewport and its pinch zoom. -->
  <script>
    try {
      if (/iP(hone|ad|od)/.test(navigator.userAgent) ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)) {
        var v = document.querySelector('meta[name="viewport"]')
        if (v) v.setAttribute("content", v.getAttribute("content") + ", maximum-scale=1")
      }
    } catch (e) {}
  </script>

  <!-- Since Chrome 135, Android's browser draws a viewport-fit=cover page
       edge-to-edge: the page runs on under the gesture/navigation bar, and
       env(safe-area-inset-bottom) reports that bar's height. The installed
       app and iOS keep their current layout, so only the Android browser
       tab sets the summary card on top of the bar (--dock-inset, index.css). -->
  <script>
    try {
      if (/Android/i.test(navigator.userAgent) && matchMedia("(display-mode: browser)").matches) {
        document.documentElement.classList.add("android-browser")
      }
    } catch (e) {}
  </script>

  <!-- A returning launch paints straight from the boot mirror (ADR 0011), so
       the static launch splash below must never show for it: this class hides
       it from the first frame. The key mirrors KEY in src/data/boot-mirror.ts
       (tests/splash-markup.test.ts checks it). -->
  <script>
    try {
      if (localStorage.getItem("yaffle:boot-mirror:v1")) {
        document.documentElement.classList.add("boot-mirror")
      }
    } catch (e) {}
  </script>

  <!-- Warm up DNS+TLS to Firebase while the JS parses: the launch paints from
       the boot mirror (#69), but auth's background accounts:lookup and the
       Firestore streams follow immediately — on mobile the handshakes are a
       real slice of that first round-trip. -->
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com" />
  <link rel="preconnect" href="https://firestore.googleapis.com" />

  <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

  <!-- iOS runs Add-to-Home-Screen apps full-screen off these (no manifest). -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Yaffle" />
</head>
