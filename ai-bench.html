<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI fill bench</title>
    <style>
      body { font: 14px/1.4 system-ui, sans-serif; margin: 16px; background: #fff; color: #111; }
      table { border-collapse: collapse; margin: 12px 0; }
      th, td { border: 1px solid #ccc; padding: 4px 8px; text-align: left; vertical-align: top; }
      td.n { text-align: right; font-variant-numeric: tabular-nums; }
      textarea { width: 100%; height: 160px; font: 12px ui-monospace, monospace; }
      button { font: inherit; padding: 6px 12px; }
    </style>
  </head>
  <body>
    <h1>AI fill bench (dev only)</h1>
    <p>
      Times the production fill request (grounding + schema) across model
      configs. Runs with <code>pnpm dev</code> and the App Check debug token
      in <code>.env.local</code>. Each call may use one grounded search from
      the 5,000/month free pool.
    </p>
    <label>Rounds per food × config <input id="rounds" type="number" value="2" min="1" max="5" /></label>
    <button id="run">Run</button>
    <span id="progress"></span>
    <h2>Summary</h2>
    <div id="summary"></div>
    <h2>Calls</h2>
    <div id="calls"></div>
    <h2>Markdown (paste back to Claude)</h2>
    <textarea id="md" readonly></textarea>
    <script type="module" src="/src/dev/ai-bench.ts"></script>
  </body>
</html>
